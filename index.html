<body class="bg-[#060b07] text-slate-100 flex justify-center min-h-screen selection:bg-amber-500 selection:text-black">

                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white flex items-center gap-1">
                        CRIC<span class="text-amber-500">COACH</span>

                </div>
            </div>
            <div>
                <span class="bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">

                </span>
            </div>
        </header>

        <main id="main-content" class="flex-1 p-4 overflow-y-auto">
            </main>

        <div id="detail-view" class="hidden fixed inset-0 z-50 bg-[#0b140e] overflow-y-auto p-4">

        <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-amber-500 text-black px-4 py-2.5 rounded-xl font-bold text-xs shadow-xl hidden flex items-center gap-2 border border-amber-400">
            <i data-lucide="check-circle" class="w-4 h-4"></i>
            <span id="toast-text">Success</span>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#080e0a]/95 backdrop-blur-lg border-t border-emerald-900/30 grid grid-cols-5 py-3 z-40 px-1 shadow-2xl">
            <button onclick="switchTab('batting')" id="nav-batting" class="flex flex-col items-center justify-center gap-1 transition-all duration-200">
                <i data-lucide="zap" class="w-5 h-5"></i>
                <span class="text-[9px] font-bold tracking-wide">Batting</span>

            <button onclick="switchTab('bowling')" id="nav-bowling" class="flex flex-col items-center justify-center gap-1 transition-all duration-200">
                <i data-lucide="orbit" class="w-5 h-5"></i>

            </button>
            <button onclick="switchTab('fielding')" id="nav-fielding" class="flex flex-col items-center justify-center gap-1 transition-all duration-200">

                <i data-lucide="sliders" class="w-5 h-5"></i>
                <span class="text-[9px] font-bold tracking-wide">Admin</span>
            </button>
        </nav>
    </div>

                        desc: 'Universal foundational techniques focused purely on capturing the ball.',
                        instructions: [
                            'Hand Positioning: Create a reliable "cup" configuration (fingers up for high catches, down for ground trajectories).',
                            'Soft Hands: Draw your hands back flexibly upon impact to cushion linear velocity.',

                        ],

                    },
                    {

                        title: 'Ground Fielding',
                        difficulty: 'Intermediate',

                        desc: 'Pure ground mechanics. Excludes high catching assets completely. Long barriers, sliding, and attacking runs.',
                        instructions: [
                            'Attack the rolling trajectory aggressively by staying low on the balls of your feet.',

                        ],

                        masterclassVideo: '6YI7Y6X8I-w' // Advanced turf attack video
                    },
                    {
                        key: 'slips_catching',
                        title: 'Slips Catching',
                        difficulty: 'Expert',

                        desc: 'Exclusively specialized slip cordon reaction training for deflection paths.',
                        instructions: [
                            'Adopt an extra wide, low stance configuration with your palms held loosely near your shins.',
                            'Filter focus entirely through the edge zone of the bat blade rather than the bowler matrix.',
                            'Execute sudden micro-reflex adjustments using low soft-cup captures to secure low deflections.'
                        ],
                        drillVideo: 'd8X79Wl7zXw', // Slip cordon training purely
                        masterclassVideo: 'uH3L-qjT6K4' // Specialized low-cup reflex catches
                    }
                ]
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            switchTab('batting');
            lucide.createIcons();
        });

        // Tab Router Logic System
        function switchTab(tabId) {
            currentTab = tabId;
            const navigationKeys = ['batting', 'bowling', 'fielding', 'aicoach', 'admin'];
            
            navigationKeys.forEach(t => {
                const element = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    element.className = "flex flex-col items-center justify-center gap-1 text-amber-500 transition-all duration-200 active:scale-95";
                } else {
                    element.className = "flex flex-col items-center justify-center gap-1 text-emerald-600/60 transition-all duration-200 active:scale-95";
                }
            });

            closeDetail();

            if (['batting', 'bowling', 'fielding'].includes(tabId)) {
                renderSkillsView(tabId);
            } else if (tabId === 'aicoach') {
                renderAiCoachView();
            } else if (tabId === 'admin') {
                renderAdminView();
            }
            lucide.createIcons();
        }

        // Skill Grid UI Layout Generation
        function renderSkillsView(categoryKey) {
            const moduleData = skillsData[categoryKey];
            const contentRegion = document.getElementById('main-content');
            
            let template = `
                <div class="mb-4 animate-in fade-in duration-150">
                    <h2 class="text-xl font-black text-white flex items-center gap-2">${moduleData.title}</h2>
                    <p class="text-xs text-emerald-400/80 mt-1">${moduleData.desc}</p>
                </div>
                <div class="grid grid-cols-1 gap-4">
            `;

            moduleData.skills.forEach(skill => {
                template += `
                    <div onclick="openDetail('${categoryKey}', '${skill.key}')" class="bg-gradient-to-b from-emerald-950/30 to-emerald-950/70 rounded-2xl border border-emerald-900/30 overflow-hidden cursor-pointer hover:border-amber-500/40 transition-all duration-200 shadow-md group">
                        <div class="relative h-36 w-full">
                            <img src="${skill.img}" class="w-full h-full object-cover opacity-75 group-hover:scale-102 transition-transform duration-300">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0b140e] via-transparent to-transparent"></div>
                            <span class="absolute top-3 right-3 text-[9px] font-bold bg-amber-500 text-black px-2 py-0.5 rounded uppercase tracking-wider">${skill.difficulty}</span>
                        </div>
                        <div class="p-4">
                            <h3 class="text-base font-bold text-white group-hover:text-amber-400 flex items-center justify-between">
                                ${skill.title}
                                <i data-lucide="chevron-right" class="w-4 h-4 text-emerald-500"></i>
                            </h3>
                            <p class="text-xs text-slate-400 mt-1 line-clamp-2">${skill.desc}</p>
                        </div>
                    </div>
                `;
            });

            template += `</div>`;
            contentRegion.innerHTML = template;
        }

        // Detailed Skill Sub-View Layer
        function openDetail(categoryKey, skillKey) {
            const skill = skillsData[categoryKey].skills.find(s => s.key === skillKey);
            const overlay = document.getElementById('detail-view');
            
            overlay.innerHTML = `
                <div class="w-full max-w-md mx-auto pb-24 animate-in slide-in-from-bottom-4 duration-200">
                    <button onclick="closeDetail()" class="flex items-center gap-1.5 text-xs font-bold text-emerald-400 mb-4 bg-emerald-950/80 border border-emerald-900/40 px-3 py-2 rounded-xl">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Fleet
                    </button>

                    <h2 class="text-2xl font-black text-white tracking-tight">${skill.title}</h2>
                    <div class="text-[10px] uppercase font-bold text-amber-400 tracking-wider mt-1">Core Training Syllabus</div>

                    <div class="bg-emerald-950/30 rounded-2xl p-4 border border-emerald-900/40 mt-4">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5 mb-3">
                            <i data-lucide="book-open" class="w-4 h-4"></i> Technical Execution Directives
                        </h4>
                        <ul class="space-y-3">
                            ${skill.instructions.map((inst, idx) => `
                                <li class="text-xs text-slate-300 flex items-start gap-2.5 line-height-relaxed">
                                    <span class="w-5 h-5 bg-emerald-900 text-emerald-400 font-bold text-[10px] flex items-center justify-center rounded-full shrink-0">${idx + 1}</span>
                                    <span>${inst}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div class="mt-5">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5 mb-2">
                            <i data-lucide="video" class="w-4 h-4 text-emerald-500"></i> Technical Drill Video
                        </h4>
                        <div class="relative w-full aspect-video rounded-2xl overflow-hidden border border-emerald-900/40 bg-black">
                            <iframe class="w-full h-full absolute inset-0" src="https://www.youtube.com/embed/${skill.drillVideo}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>

                    <div class="mt-5">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5 mb-2">
                            <i data-lucide="award" class="w-4 h-4 text-amber-500"></i> Pro Player Masterclass Video
                        </h4>
                        <div class="relative w-full aspect-video rounded-2xl overflow-hidden border border-emerald-900/40 bg-black">
                            <iframe class="w-full h-full absolute inset-0" src="https://www.youtube.com/embed/${skill.masterclassVideo}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
            `;
            overlay.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeDetail() {
            document.getElementById('detail-view').classList.add('hidden');
        }

        // AI Tactical Coach Module
        function renderAiCoachView() {
            const contentRegion = document.getElementById('main-content');
            
            let template = `
                <div class="flex flex-col h-[calc(100vh-10.5rem)] animate-in fade-in duration-150">
                    <div class="mb-2">
                        <h2 class="text-xl font-black text-white flex items-center gap-2">Tactical AI Engine</h2>
                        <p class="text-[10px] text-slate-400 font-medium">Active Frameworks: <span class="text-amber-400">Steffan Jones, Ian Pont, Mushtaq Ahmed</span></p>
                    </div>

                    <div id="chat-stream" class="flex-1 overflow-y-auto bg-emerald-950/10 rounded-2xl p-3 border border-emerald-900/20 space-y-3 mb-2 flex flex-col no-scrollbar">
            `;

            chatHistory.forEach(msg => {
                const isAi = msg.sender === 'ai';
                template += `
                    <div class="flex flex-col ${isAi ? 'items-start' : 'items-end'} max-w-[85%] ${isAi ? 'self-start' : 'self-end'}">
                        <div class="p-3 rounded-2xl text-xs leading-relaxed ${isAi ? 'bg-emerald-950/60 border border-emerald-900/40 text-slate-200' : 'bg-amber-500 text-black font-semibold'}">
                            ${msg.file ? `<div class="mb-2 rounded-lg overflow-hidden border border-black/20 shadow"><img src="${msg.file}" class="max-h-32 object-cover w-full"/></div>` : ''}
                            ${msg.text}
                        </div>
                        <span class="text-[8px] text-slate-500 mt-1 px-1">${msg.time}</span>
                    </div>
                `;
            });

            template += `
                        <div id="typing-indicator" class="hidden flex items-center gap-2 bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-900/30 self-start text-[10px] text-emerald-400">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                            <span>Analyzing technique with Gemini AI...</span>
                        </div>
                    </div>

                    <div id="preview-bar" class="hidden bg-emerald-950 border border-emerald-900/50 p-2 rounded-xl mb-2 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <img id="preview-thumb" src="" class="w-8 h-8 object-cover rounded border border-emerald-800" />
                            <span class="text-[10px] text-slate-300 font-mono truncate max-w-[180px]" id="preview-filename"></span>
                        </div>
                        <button onclick="clearAttachment()" class="text-slate-400"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>

                    <div class="flex items-center gap-2 bg-[#080e0a] border border-emerald-900/40 rounded-2xl p-1.5 relative">
                        <button onclick="triggerFileInput()" class="p-2.5 text-emerald-400 bg-emerald-950/80 rounded-xl active:scale-95 transition-all">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                        </button>
                        <input type="file" id="camera-file-input" accept="image/*,video/*" class="hidden" onchange="handleFileSelect(event)" />
                        
                        <input type="text" id="chat-input" onkeypress="if(event.key === 'Enter') submitChatMessage()" placeholder="Ask about Steffan Jones isometric metrics..." class="flex-1 bg-transparent text-xs text-white placeholder-slate-600 focus:outline-none px-2" />
                        
                        <button onclick="submitChatMessage()" class="p-2.5 text-black bg-amber-500 rounded-xl font-bold">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
            contentRegion.innerHTML = template;
            setTimeout(() => {
                const stream = document.getElementById('chat-stream');
                if (stream) stream.scrollTop = stream.scrollHeight;
            }, 20);
        }

        let selectedFileBase64 = null;
        let selectedFileName = "";

        function triggerFileInput() {
            document.getElementById('camera-file-input').click();
        }

        function handleFileSelect(e) {
            const file = e.target.files;
            if (!file) return;
            selectedFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedFileBase64 = evt.target.result;
                document.getElementById('preview-thumb').src = selectedFileBase64;
                document.getElementById('preview-filename').innerText = file.name;
                document.getElementById('preview-bar').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            selectedFileBase64 = null;
            selectedFileName = "";
            document.getElementById('camera-file-input').value = "";
            document.getElementById('preview-bar').classList.add('hidden');
        }

        function submitChatMessage() {
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();

            if (!messageText && !selectedFileBase64) return;

            chatHistory.push({
                id: Date.now(),
                sender: 'user',
                text: messageText || `Attached visual profile: ${selectedFileName}`,
                time: 'Just Now',
                file: selectedFileBase64
            });

            renderAiCoachView();
            const indicator = document.getElementById('typing-indicator');
            indicator.classList.remove('hidden');

            if (selectedFileBase64) showToast("Analyzing technique with Gemini AI...");

            const userPrompt = messageText.toLowerCase();
            clearAttachment();

            setTimeout(() => {
                let aiReply = "Elite Tactical Response: Ensure your setup vectors remain stable. Maintain completely soft hands into your impact metrics to maximize control indexes.";
                
                if (userPrompt.includes('pace') || userPrompt.includes('bowling') || userPrompt.includes('outswing')) {
                    aiReply = "Steffan Jones & Ian Pont Framework: Focus heavily on your isometric wall-holds to lock entry power profiles. Enforce the 4 Tent Peg alignment sequence—keep your front leg acting as an immediate, rigid brake to drive force straight through the release window.";
                } else if (userPrompt.includes('spin') || userPrompt.includes('off-break')) {
                    aiReply = "Mushtaq Ahmed & Peter Such Analysis: To increase rotation metrics, ensure your index finger sweeps through the ball loop apex at a sharp 45-degree angle. Push shoulder line rotation upward to achieve a steep parabolic loop drop.";
                } else if (userPrompt.includes('catch') || userPrompt.includes('fielding')) {
                    aiReply = "Fielding Protocol: Maintain a wide baseline configuration. Form a perfect low-cup layout with fingers pointing down, absorbing structural energy backward upon ball intercept.";
                }

                chatHistory.push({
                    id: Date.now() + 1,
                    sender: 'ai',
                    text: aiReply,
                    time: 'Just Now',
                    file: null
                });

                renderAiCoachView();
            }, 1500);
        }

        // Automated Content Scraper Pipeline Dashboard View
        function renderAdminView() {
            const contentRegion = document.getElementById('main-content');
            
            let template = `
                <div class="space-y-4 animate-in fade-in duration-150">
                    <div>
                        <h2 class="text-xl font-black text-white flex items-center gap-2">Admin Pipeline Dashboard</h2>
                        <p class="text-xs text-emerald-400/80 mt-1">Simulated YouTube Data API Ingestion Channel</p>
                    </div>

                    <div class="bg-gradient-to-r from-emerald-950/40 to-slate-900 border border-emerald-900/30 p-4 rounded-2xl">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Active API Key-Matchers</span>
                            <span class="text-[9px] bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded-full font-bold">LIVE CRAWLER</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5 text-[10px] text-slate-300">
                            <span class="bg-[#0f2315] border border-emerald-800 px-2 py-0.5 rounded">'cricket outswing tutorial'</span>
                            <span class="bg-[#0f2315] border border-emerald-800 px-2 py-0.5 rounded">'slips catching drills'</span>
                        </div>
                    </div>

                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest pt-1">Buffered Video Streaming Influx</h3>
                    <div class="space-y-3" id="pipeline-list">
            `;

            if (adminPipelineVideos.length === 0) {
                template += `
                    <div class="text-center p-8 bg-emerald-950/10 border border-emerald-900/20 rounded-2xl text-xs text-slate-500">
                        <i data-lucide="folder-open" class="w-6 h-6 mx-auto mb-2 opacity-60"></i>
                        Ingestion pipeline queue currently clear.
                    </div>
                `;
            } else {
                adminPipelineVideos.forEach(vid => {
                    template += `
                        <div class="bg-gradient-to-b from-[#0d1610] to-[#0a0f0b] border border-emerald-900/30 rounded-xl p-3 flex flex-col gap-3">
                            <div class="flex gap-3">
                                <div class="w-24 aspect-video bg-black rounded-lg overflow-hidden shrink-0 relative border border-emerald-900/40">
                                    <img src="https://img.youtube.com/vi/${vid.youtubeId}/mqdefault.jpg" class="w-full h-full object-cover opacity-80" />
                                </div>
                                <div class="min-w-0 flex-1">
                                    <h4 class="text-xs font-bold text-white truncate">${vid.title}</h4>
                                    <p class="text-[10px] text-emerald-400 mt-0.5">${vid.author}</p>
                                    <div class="text-[8px] font-mono text-slate-500 uppercase tracking-wider mt-1">Target Module: ${vid.category} -> ${vid.skillKey}</div>
                                </div>
                            </div>
                            <div class="flex justify-end gap-2 border-t border-emerald-900/10 pt-2">
                                <button onclick="rejectVideo('${vid.id}')" class="text-[10px] font-bold text-rose-400 bg-rose-950/30 border border-rose-900/30 px-3 py-1.5 rounded-lg">Reject</button>
                                <button onclick="approveVideo('${vid.id}')" class="text-[10px] font-bold text-black bg-amber-500 px-3 py-1.5 rounded-lg shadow">Approve & Push</button>
                            </div>
                        </div>
                    `;
                });
            }

            template += `</div></div>`;
            contentRegion.innerHTML = template;
        }

        function approveVideo(id) {
            const item = adminPipelineVideos.find(v => v.id === id);
            if (!item) return;

            const skillNode = skillsData[item.category].skills.find(s => s.key === item.skillKey);
            if (skillNode) {
                skillNode.drillVideo = item.youtubeId; // Dynamic pipeline deployment update
            }

            adminPipelineVideos = adminPipelineVideos.filter(v => v.id !== id);
            showToast("Video dynamically assigned live to Skills Tab!");
            renderAdminView();
            lucide.createIcons();
        }

        function rejectVideo(id) {
            adminPipelineVideos = adminPipelineVideos.filter(v => v.id !== id);
            showToast("Video dropped from streaming buffer.");
            renderAdminView();
            lucide.createIcons();
        }

        function showToast(msg) {
            const bar = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            bar.classList.remove('hidden');
            setTimeout(() => { bar.classList.add('hidden'); }, 3000);
        }
    </script>
</body>
</html>
