        // Initialize App & Mount Engine
        window.addEventListener('DOMContentLoaded', () => {
            switchTab('batting');
            lucide.createIcons();
        });

        // Dynamic State-Driven View Router
        function switchTab(tabId) {
            currentTab = tabId;
            
            // Update Active UI Navigation State
            const navigationTabs = ['batting', 'bowling', 'fielding', 'aicoach', 'admin'];
            navigationTabs.forEach(tab => {
                const btn = document.getElementById(`nav-${tab}`);
                if (tab === tabId) {
                    btn.classList.remove('text-emerald-600/70');
                    btn.classList.add('text-amber-500');
                } else {
                    btn.classList.remove('text-amber-500');
                    btn.classList.add('text-emerald-600/70');
                }
            });

            // Close modal overlays automatically on tab mutations
            closeDetail();

            const mainContent = document.getElementById('main-content');
            
            if (tabId === 'batting' || tabId === 'bowling' || tabId === 'fielding') {
                renderSkillsView(tabId);
            } else if (tabId === 'aicoach') {
                renderAiCoachView();
            } else if (tabId === 'admin') {
                renderAdminView();
            }
            lucide.createIcons();
        }

        // Render Skill Grid Interfaces
        function renderSkillsView(categoryKey) {
            const data = skillsData[categoryKey];
            const mainContent = document.getElementById('main-content');

                    <p class="text-xs text-emerald-400/80 mt-1">${data.desc}</p>
                </div>
                <div class="grid grid-cols-1 gap-4 mt-2">
            `;

            data.skills.forEach(skill => {
                html += `
                    <div onclick="openDetail('${categoryKey}', '${skill.key}')" class="bg-gradient-to-b from-emerald-950/40 to-emerald-950/90 rounded-2xl border border-emerald-900/30 overflow-hidden cursor-pointer hover:border-amber-500/40 transition-all duration-300 group shadow-lg active:scale-[0.99]">

                    <div id="chat-stream" class="flex-1 overflow-y-auto bg-emerald-950/20 rounded-2xl p-3 border border-emerald-900/30 space-y-3 mb-3 flex flex-col">

            chatHistory.forEach(msg => {
                const isAi = msg.sender === 'ai';
                html += `

                                <p class="text-amber-400 font-medium" id="preview-status">Ready for Gemini Payload</p>
                            </div>
                        </div>
                        <button onclick="clearAttachment()" class="text-slate-400 hover:text-white p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>

                    <div class="flex items-center gap-2 bg-[#0c1710] border border-emerald-900/50 rounded-2xl p-1.5 shadow-xl relative">
                        <button onclick="triggerFileInput()" class="p-2.5 text-emerald-400 bg-emerald-950 rounded-xl border border-emerald-900/40 active:scale-95 transition-all">
                            <i data-lucide="camera" class="w-5 h-5"></i>
                        </button>
                        <input type="file" id="camera-file-input" accept="image/*,video/*" class="hidden" onchange="handleFileSelect(event)" />
                        
                        <input type="text" id="chat-input" onkeypress="handleKeyPress(event)" placeholder="Ask Steffan Jones speed metrics..." class="flex-1 bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none px-2" />
                        
                        <button onclick="submitChatMessage()" class="p-2.5 text-black bg-amber-500 rounded-xl hover:bg-amber-400 active:scale-95 transition-all font-bold">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
            mainContent.innerHTML = html;
            setTimeout(() => {
                const stream = document.getElementById('chat-stream');
                stream.scrollTop = stream.scrollHeight;
            }, 50);
        }

        // Multimodal Attachment Pipeline
        let selectedFileBase64 = null;
        let selectedFileName = "";

        function triggerFileInput() {
            document.getElementById('camera-file-input').click();
        }

        function handleFileSelect(e) {
            const file = e.target.files;
            if (!file) return;
            
            selectedFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedFileBase64 = evt.target.result;
                
                // Show thumbnail bar component
                document.getElementById('preview-thumb').src = selectedFileBase64;
                document.getElementById('preview-filename').innerText = file.name;
                document.getElementById('preview-bar').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            selectedFileBase64 = null;
            selectedFileName = "";
            document.getElementById('camera-file-input').value = "";
            document.getElementById('preview-bar').classList.add('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') submitChatMessage();
        }

        function submitChatMessage() {
            const input = document.getElementById('chat-input');
            const queryText = input.value.trim();
            
            if (!queryText && !selectedFileBase64) return;

            // Instantly append user message bubble to view log stream
            chatHistory.push({
                id: Date.now(),
                sender: 'user',
                text: queryText || `Uploaded attachment file: ${selectedFileName}`,
                time: 'Just Now',
                file: selectedFileBase64
            });

            // Re-render immediate view state state
            renderAiCoachView();

            // Fire simulated processing pipeline layout response
            const indicator = document.getElementById('typing-indicator');
            indicator.classList.remove('hidden');
            
            if (selectedFileBase64) {
                showToast("Analyzing technique with Gemini AI...");
            }

            // Clear buffers out
            const textToProcess = queryText;
            const activeFile = selectedFileBase64;
            clearAttachment();
            
            setTimeout(() => {
                let aiResponse = "";
                
                if (activeFile) {
                    aiResponse = `[Gemini Payload Multi-part Matrix Processed] Biomechanical analysis computed: Your wrist positioning exhibits localized drift during delivery extension. Emulating Steffan Jones' isometric framework, ensure you lock the wrist joint angles with weighted-ball activation sets before live bowling.`;
                } else {
                    const lowercaseQuery = textToProcess.toLowerCase();
                    if (lowercaseQuery.includes('bowling') || lowercaseQuery.includes('pace') || lowercaseQuery.includes('outswing')) {
                        aiResponse = `Steffan Jones Paradigm Activated: To enforce true energy retention through completion, deploy the 4 Tent Peg alignment sequence (Ian Pont structure). Ensure the front foot plants firmly as an immovable brake to fling kinetic speed vertical parameters down the channel track.`;
                    } else if (lowercaseQuery.includes('spin') || lowercaseQuery.includes('off-break')) {
                        aiResponse = `Craig Howard & Peter Such Analysis: Ensure your index finger cuts through the ball apex at 45 degrees. To extract supreme flight variation drop variables like Mushtaq Ahmed, increase shoulder elevation at delivery axis point.`;
                    } else {
                        aiResponse = `Elite Tactical Response: Ensure your base centers fully beneath the core line of ball flight coordinates. Maintain soft hands following contact rules to systematically control ball acceleration trajectories.`;
                    }
                }

                chatHistory.push({
                    id: Date.now() + 1,
                    sender: 'ai',
                    text: aiResponse,
                    time: 'Just Now',
                    file: null
                });

                renderAiCoachView();
            }, 1500);
        }

        // Render Automated YouTube Data Admin Pipeline View
        function renderAdminView() {
            const mainContent = document.getElementById('main-content');
            
            let html = `
                <div class="space-y-4 animate-in fade-in duration-200">
                    <div>
                        <h2 class="text-xl font-black text-white flex items-center gap-2">
                            Automation Pipeline
                        </h2>
                        <p class="text-xs text-emerald-400/80 mt-1">Simulated YouTube Data API Live Content Scraper</p>
                    </div>

                    <div class="bg-gradient-to-r from-emerald-950 to-[#0c1710] border border-emerald-900/40 p-4 rounded-2xl shadow-md">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold text-white uppercase tracking-wider block">API Crawler Targets</span>
                            <span class="text-[10px] bg-emerald-900 text-emerald-300 font-semibold px-2 py-0.5 rounded-full">Automated Mode</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                            <span class="text-[10px] bg-[#0f2d1a] border border-emerald-800 text-slate-300 px-2 py-1 rounded-md">'cricket outswing tutorial'</span>
                            <span class="text-[10px] bg-[#0f2d1a] border border-emerald-800 text-slate-300 px-2 py-1 rounded-md">'slips catching mechanics'</span>
                            <span class="text-[10px] bg-[#0f2d1a] border border-emerald-800 text-slate-300 px-2 py-1 rounded-md">'cover drive masterclass'</span>
                        </div>
                    </div>

                    <h3 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider pt-2">Fetched Video Metadata Buffer (${adminPipelineVideos.length})</h3>
                    
                    <div class="space-y-3" id="admin-video-list">
            `;

            if (adminPipelineVideos.length === 0) {
                html += `
                    <div class="text-center p-8 bg-emerald-950/20 border border-emerald-900/30 rounded-2xl text-xs text-slate-400">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto text-emerald-700 mb-2"></i>
                        No pending automation assets in queue pipeline.
                    </div>
                `;
            } else {
                adminPipelineVideos.forEach(v => {
                    html += `
                        <div id="video-row-${v.id}" class="bg-gradient-to-b from-[#132319] to-[#0d1a12] border border-emerald-900/40 rounded-xl p-3 flex flex-col gap-2.5 transition-all">
                            <div class="flex items-start gap-3">
                                <div class="w-24 aspect-video bg-black rounded-lg overflow-hidden shrink-0 relative border border-emerald-900/60">
                                    <img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" class="w-full h-full object-cover" />
                                    <span class="absolute bottom-1 right-1 text-[8px] bg-black/80 px-1 py-0.2 text-white font-mono rounded">API</span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="text-xs font-bold text-white truncate">${v.title}</h4>
                                    <p class="text-[10px] text-emerald-400 mt-0.5">${v.author}</p>
                                    <p class="text-[9px] text-slate-500 mt-1 uppercase font-semibold tracking-wider">Target: ${v.category} -> ${v.skillKey.replace('_',' ')}</p>
                                </div>
                            </div>
                            <div class="flex items-center justify-end gap-2 border-t border-emerald-900/20 pt-2.5">
                                <button onclick="rejectPipelineVideo('${v.id}')" class="text-[10px] font-bold text-rose-400 bg-rose-950/40 border border-rose-900/40 px-3 py-1.5 rounded-lg active:scale-95 transition-all flex items-center gap-1">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i> Reject
                                </button>
                                <button onclick="approvePipelineVideo('${v.id}')" class="text-[10px] font-bold text-black bg-amber-500 px-3 py-1.5 rounded-lg active:scale-95 transition-all flex items-center gap-1 shadow-md shadow-amber-950/20">
                                    <i data-lucide="check" class="w-3 h-3"></i> Approve & Deploy
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            mainContent.innerHTML = html;
        }

        // Wire Automated Dashboard Logic System
        function approvePipelineVideo(id) {
            const targetVideo = adminPipelineVideos.find(v => v.id === id);
            if (!targetVideo) return;

            // Route Data to Live Grid Content Database Component Matrix
            const targetCategory = targetVideo.category;
            const targetSkillKey = targetVideo.skillKey;
            
            const liveSkill = skillsData[targetCategory].skills.find(s => s.key === targetSkillKey);
            if (liveSkill) {
                // Dynamically swap/update the drill video to the approved video item
                liveSkill.drillVideo = targetVideo.youtubeId;
            }

            // Remove item from simulated pipeline queue state
            adminPipelineVideos = adminPipelineVideos.filter(v => v.id !== id);
            
            showToast("Video deployed live to Skill Tab components successfully!");
            renderAdminView();
            lucide.createIcons();
        }

        function rejectPipelineVideo(id) {
            adminPipelineVideos = adminPipelineVideos.filter(v => v.id !== id);
            showToast("Video rejected and cleared from buffer.");
            renderAdminView();
            lucide.createIcons();
        }

        // Global Toast Notification Helper
        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
